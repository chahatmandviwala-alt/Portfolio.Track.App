
name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl --fail --silent --show-error \
            --max-time 60 \
            --retry 2 \
            https://portfolio-track-app.onrender.com/health
